<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ServerSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'midnight': '#0f172a', /* slate-900 */
                        'electric-blue': '#3b82f6',
                        'neon-mint': '#34d399',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-midnight text-white min-h-screen flex flex-col justify-center items-center">
    <div class="w-full max-w-md px-4">
        <div class="bg-slate-800 rounded-lg shadow-xl p-8">
            <h2 class="text-3xl font-bold text-center mb-6 text-electric-blue">Login to ServerSync</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-4 p-4 rounded {% if category == 'danger' %}bg-red-500{% else %}bg-green-500{% endif %} text-white">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1 text-gray-300">Email address</label>
                    <input type="email" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded focus:outline-none focus:border-electric-blue text-white" name="email" required>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-1 text-gray-300">Password</label>
                    <input type="password" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded focus:outline-none focus:border-electric-blue text-white" name="password" required>
                </div>

                <div class="flex items-center mb-6">
                    <input type="checkbox" name="remember" class="w-4 h-4 text-electric-blue bg-slate-700 border-slate-600 rounded focus:ring-electric-blue focus:ring-2" id="rememberCheck">
                    <label class="ml-2 text-sm text-gray-300" for="rememberCheck">Remember me</label>
                </div>

                <button type="submit" class="w-full bg-electric-blue hover:bg-blue-600 text-white font-bold py-3 px-4 rounded transition duration-200">Login</button>
            </form>
            <div class="text-center mt-6">
                <a href="/register" class="text-sm text-gray-400 hover:text-white transition duration-200">Don't have an account? Register here.</a>
            </div>
        </div>
    </div>
</body>
</html>
