<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ServerSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'midnight': '#0f172a', /* slate-900 */
                        'electric-blue': '#3b82f6',
                        'neon-mint': '#34d399',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-midnight text-white min-h-screen flex flex-col">
    <div class="container mx-auto px-4 mt-10 max-w-lg">
        <div class="bg-slate-800 rounded-lg shadow-xl p-8">
            <h2 class="text-3xl font-bold text-center mb-6 text-electric-blue">Create Your Account</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-4 p-4 rounded {% if category == 'danger' %}bg-red-500{% else %}bg-green-500{% endif %} text-white">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="">
                <h5 class="text-xl mb-4 font-semibold text-neon-mint">Profile Details</h5>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Email address</label>
                    <input type="email" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded focus:outline-none focus:border-electric-blue" name="email" required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Company Name</label>
                    <input type="text" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded focus:outline-none focus:border-electric-blue" name="company_name">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded focus:outline-none focus:border-electric-blue" name="password" required>
                </div>

                <h5 class="text-xl mt-6 mb-4 font-semibold text-neon-mint">Payment Information <span class="text-sm font-normal">($350/year)</span></h5>

                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Card Brand</label>
                    <select class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded focus:outline-none focus:border-electric-blue" name="card_brand" required>
                        <option value="Visa">Visa</option>
                        <option value="Mastercard">Mastercard</option>
                        <option value="Amex">American Express</option>
                        <option value="Discover">Discover</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Credit Card Number</label>
                    <input type="text" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded focus:outline-none focus:border-electric-blue" name="card_number" placeholder="XXXX-XXXX-XXXX-XXXX" required>
                </div>

                <div class="flex gap-4 mb-6">
                    <div class="w-1/2">
                        <label class="block text-sm font-medium mb-1">Expiry (MM/YY)</label>
                        <input type="text" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded focus:outline-none focus:border-electric-blue" name="expiry" placeholder="MM/YY" required>
                    </div>
                    <div class="w-1/2">
                        <label class="block text-sm font-medium mb-1">CVV</label>
                        <input type="text" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded focus:outline-none focus:border-electric-blue" name="cvv" placeholder="123" required>
                    </div>
                </div>

                <button type="submit" class="w-full bg-electric-blue hover:bg-blue-600 text-white font-bold py-3 px-4 rounded transition duration-200">Register & Pay</button>
            </form>
            <div class="text-center mt-6">
                <a href="/login" class="text-sm text-gray-400 hover:text-white transition duration-200">Already have an account? Login here.</a>
            </div>
        </div>
    </div>
</body>
</html>
